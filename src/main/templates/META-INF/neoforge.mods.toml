modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/SelluaStar/Skyseam/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
logoFile="logo.png"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Ships, physics and the Create parts the Harmonic Aperture and the Pneumatic Coupler use.
[[dependencies.${mod_id}]]
modId="create"
type="required"
versionRange="${create_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="simulated"
type="required"
versionRange="${simulated_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="aeronautics"
type="required"
versionRange="${aeronautics_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sable"
type="required"
versionRange="${sable_version_range}"
ordering="AFTER"
side="BOTH"

# Animated creatures, bosses and block entities.
[[dependencies.${mod_id}]]
modId="geckolib"
type="required"
versionRange="${geckolib_version_range}"
ordering="AFTER"
side="BOTH"

# Rumours, the Stargazer's conversations and the favor quests are built on Fealty's API 1.3.0.
[[dependencies.${mod_id}]]
modId="fealty"
type="required"
versionRange="${fealty_version_range}"
ordering="AFTER"
side="BOTH"

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main {
        resources.srcDir 'src/generated/resources'
    }
}

repositories {
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'RyanHCode (Sable)'
        url = 'https://maven.ryanhcode.dev/releases'
        content { includeGroupAndSubgroups 'dev.ryanhcode' }
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupAndSubgroups 'software.bernie' }
    }
    maven {
        name = 'Create'
        url = 'https://maven.createmod.net'
        content {
            includeGroup 'com.simibubi.create'
            includeGroupAndSubgroups 'net.createmod'
            includeGroupAndSubgroups 'dev.engine-room'
        }
    }
    maven {
        name = 'FTB (optional FTB Teams support)'
        url = 'https://maven.ftb.dev/releases'
        content { includeGroupAndSubgroups 'dev.ftb' }
    }
}

// Mods that ship nested jars (Create: Flywheel, Ponder, Registrate. Aeronautics: Simulated, Offroad.
// Sable: Veil, rapier natives, sable-companion) only load those nested jars from a mods folder.
// So the runtime mods are copied into run/mods/ exactly as a player would install them.
configurations {
    runMods {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    // The author's three test clients (docs/DECISIONS.md K100), all in run/ so they share worlds. None of these mods is
    // ever shipped or required, and runServer, the GameTests and runData never load them:
    //   gradlew runClient         Distant Horizons and the performance mods (perfMods)
    //   gradlew runShaderClient   the same, and Iris for shader packs
    //   gradlew runModdedClient   the same with shaders, and the playtest mods (maps, Jade, C2ME, Yeetus Experimentus)
    // The screenshot client (runCaptureClient) takes them by flag: -Pdh, -Pshaders, -Pperf, -Pplaytest.
    //
    // Iris (with Sodium, which it needs), to see the Halcyon's sky under a shader pack (K86).
    shaderMods {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    // Distant Horizons, to check far terrain and the glow blocks Skyseam asks it to leave out (K95).
    lodMods {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    // Mods that make the game run faster, and are safe beside everything: Sodium, Lithium, FerriteCore, ImmediatelyFast.
    perfMods {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    // Only in the modded client: Xaero's Minimap and World Map and Jade for easier testing, Yeetus Experimentus (no
    // experimental-settings warning), and C2ME, an alpha that rewrites world generation's threading, kept out of the
    // normal client so that one stays a clean check on Skyseam's own world generation.
    playtestMods {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // Sable and its Companion API are compile-only: at runtime they load from run/mods (see runMods below).
    compileOnly("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") { transitive = false }
    compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}") { transitive = false }
    compileOnly files("libs/fealty-${fealty_version}+api.${fealty_api_version}-api.jar")
    // Optional: Aperture teammates in packs that run FTB Teams. Never required, never shipped (compat/ftbteams).
    compileOnly("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}") { transitive = false }
    // Optional: the far flux vortices are drawn through Distant Horizons' API when it is installed (client/compat).
    // Never required, never shipped.
    compileOnly("maven.modrinth:distanthorizons:${distant_horizons_version}") { transitive = false }

    runMods "maven.modrinth:create:${create_version}"
    runMods "maven.modrinth:create-aeronautics:${aeronautics_version}"
    runMods "dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}"
    runMods files("libs/fealty-${fealty_version}.jar")

    shaderMods "maven.modrinth:iris:${iris_version}"
    shaderMods "maven.modrinth:sodium:${sodium_version}"
    lodMods "maven.modrinth:distanthorizons:${distant_horizons_version}"

    perfMods "maven.modrinth:sodium:${sodium_version}"
    perfMods "maven.modrinth:lithium:${lithium_version}"
    perfMods "maven.modrinth:ferrite-core:${ferritecore_version}"
    perfMods "maven.modrinth:immediatelyfast:${immediatelyfast_version}"

    playtestMods "maven.modrinth:xaeros-minimap:${xaeros_minimap_version}"
    playtestMods "maven.modrinth:xaeros-world-map:${xaeros_world_map_version}"
    playtestMods "maven.modrinth:jade:${jade_version}"
    playtestMods "maven.modrinth:c2me-neoforge:${c2me_version}"
    playtestMods "maven.modrinth:yeetus-experimentus:${yeetus_experimentus_version}"
}

// Aeronautics and Create keep the classes Skyseam compiles against (the balloon map, Simulated's ropes, catnip's
// WorldAttached in Ponder) inside nested jars. Extract just those for the compile classpath; at runtime they load
// from run/mods. Create itself is on the compile classpath too, because Simulated's rope holder is a Create behaviour.
def nestedModsDir = layout.buildDirectory.dir('nested-mods')
def extractNestedMods = tasks.register('extractNestedMods', Sync) {
    description = 'Extracts the nested Aeronautics, Simulated and Ponder jars that Skyseam compiles against.'
    from {
        configurations.runMods.filter { it.name.startsWith('create-') }.collect { zipTree(it) }
    }
    include 'META-INF/jarjar/dev.eriksonn.aeronautics.aeronautics-*.jar', 'META-INF/jarjar/dev.simulated_team.simulated.simulated-*.jar',
            'META-INF/jarjar/ponder-*.jar'
    eachFile { path = name }
    includeEmptyDirs = false
    into nestedModsDir
}
dependencies {
    compileOnly files(nestedModsDir.map { it.asFileTree.matching { include '*.jar' } }).builtBy(extractNestedMods)
    compileOnly("maven.modrinth:create:${create_version}") { transitive = false }
}

// run/mods is shared by the three test clients and the other runs, each with its own set of mods, and Gradle only
// tracks the files a task wrote itself into a shared folder, so it would call a sync up to date with another's extra
// jars in it. Each sync runs every time instead.
def captureDir = file(project.findProperty('captureDir') ?: 'run/capture')
def syncRunMods = tasks.register('syncRunMods', Sync) {
    outputs.upToDateWhen { false }
    description = 'Copies the runtime mods (Create, Aeronautics, Sable, Fealty) into run/mods.'
    from configurations.runMods
    into file('run/mods')
}
// The sync for each test client, by its run task.
def clientSyncs = [
        runClient      : [configurations.lodMods, configurations.perfMods],
        runShaderClient: [configurations.lodMods, configurations.perfMods, configurations.shaderMods],
        runModdedClient: [configurations.lodMods, configurations.perfMods, configurations.shaderMods, configurations.playtestMods],
].collectEntries { runTask, extras ->
    def sync = tasks.register("sync${runTask.substring(3)}Mods", Sync) {
        outputs.upToDateWhen { false }
        description = "Copies the runtime mods and the ${runTask} test mods into run/mods."
        // Sodium is in both perfMods and shaderMods.
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        from configurations.runMods
        extras.each { from it }
        into file('run/mods')
    }
    [(runTask): sync]
}
def syncCaptureMods = tasks.register('syncCaptureMods', Sync) {
    outputs.upToDateWhen { false }
    description = 'Copies the runtime mods into run/capture/mods for the screenshot client (runCaptureClient), with Iris and Sodium when -Pshaders is set, Distant Horizons when -Pdh is set, the performance mods when -Pperf is set, and those and the playtest mods when -Pplaytest is set.'
    // Sodium is in both shaderMods and playtestMods.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from configurations.runMods
    if (project.hasProperty('shaders')) {
        from configurations.shaderMods
    }
    // -Pperf: the performance mods; -Pplaytest: those and the modded client's playtest mods, to check they load.
    if (project.hasProperty('perf') || project.hasProperty('playtest')) {
        from configurations.perfMods
    }
    if (project.hasProperty('playtest')) {
        from configurations.playtestMods
    }
    if (project.hasProperty('dh')) {
        from configurations.lodMods
    }
    into new File(captureDir, 'mods')
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        // The author's three test clients (see the configurations above), sharing run/ and its worlds.
        client {
            client()
        }
        shaderClient {
            client()
        }
        moddedClient {
            client()
        }
        server {
            server()
            programArgument '--nogui'
            // gradlew runServer -PbootCheck: stop on its own once the server has started (dev/DevBootCheck).
            systemProperty 'skyseam.dev.stopAfterBoot', project.hasProperty('bootCheck').toString()
            // gradlew runServer -PbootCheck -PhalcyonMap: also write maps of the Halcyon's plan to build/previews.
            systemProperty 'skyseam.dev.map', project.hasProperty('halcyonMap') ? file('build/previews').absolutePath : ''
        }
        gameTestServer {
            type = 'gameTestServer'
        }
        // gradlew runCaptureClient -Pscene=tools/capture/<scene>.json: a throwaway client in run/capture that plays a
        // scene and saves screenshots to run/capture/screenshots (client/dev/DevSceneCapture). Development only.
        captureClient {
            client()
            // -PcaptureDir=run/capture2 runs it in another folder, beside one already open in run/capture.
            gameDirectory = captureDir
            systemProperty 'skyseam.dev.capture', project.findProperty('scene') ? file(project.findProperty('scene')).absolutePath : ''
            programArguments.addAll '--width', '1280', '--height', '720'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            // -PgametestNamespaces=sable runs another mod's GameTests (used by the Step 0 physics check).
            systemProperty 'neoforge.enabledGameTestNamespaces',
                    (project.findProperty('gametestNamespaces') ?: project.mod_id).toString()
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range  : minecraft_version_range,
            neo_version_range        : neo_version_range,
            loader_version_range     : loader_version_range,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_license              : mod_license,
            mod_version              : mod_version,
            mod_authors              : mod_authors,
            mod_description          : mod_description,
            create_version_range     : create_version_range,
            simulated_version_range  : simulated_version_range,
            aeronautics_version_range: aeronautics_version_range,
            sable_version_range      : sable_version_range,
            geckolib_version_range   : geckolib_version_range,
            fealty_version_range     : fealty_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// runClient shares run/ with runServer and the GameTests, so each syncs run/mods to its own set as it starts.
tasks.matching { it.name.startsWith('run') && it.name != 'runMods' && !clientSyncs.containsKey(it.name) }.configureEach {
    dependsOn syncRunMods
}
tasks.matching { clientSyncs.containsKey(it.name) }.configureEach {
    dependsOn clientSyncs[it.name]
}
tasks.matching { it.name == 'runCaptureClient' }.configureEach {
    dependsOn syncCaptureMods
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

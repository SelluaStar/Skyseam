plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main {
        resources.srcDir 'src/generated/resources'
    }
}

repositories {
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'RyanHCode (Sable)'
        url = 'https://maven.ryanhcode.dev/releases'
        content { includeGroupAndSubgroups 'dev.ryanhcode' }
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroupAndSubgroups 'software.bernie' }
    }
    maven {
        name = 'Create'
        url = 'https://maven.createmod.net'
        content {
            includeGroup 'com.simibubi.create'
            includeGroupAndSubgroups 'net.createmod'
            includeGroupAndSubgroups 'dev.engine-room'
        }
    }
}

// Mods that ship nested jars (Create: Flywheel, Ponder, Registrate. Aeronautics: Simulated, Offroad.
// Sable: Veil, rapier natives, sable-companion) only load those nested jars from a mods folder.
// So the runtime mods are copied into run/mods/ exactly as a player would install them.
configurations {
    runMods {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // Sable and its Companion API are compile-only: at runtime they load from run/mods (see runMods below).
    compileOnly("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") { transitive = false }
    compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}") { transitive = false }
    compileOnly files("libs/fealty-${fealty_version}+api.${fealty_api_version}-api.jar")

    runMods "maven.modrinth:create:${create_version}"
    runMods "maven.modrinth:create-aeronautics:${aeronautics_version}"
    runMods "dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}"
    runMods files("libs/fealty-${fealty_version}.jar")
}

// Aeronautics and Create keep the classes Skyseam compiles against (the balloon map, catnip's WorldAttached in
// Ponder) inside nested jars. Extract just those for the compile classpath; at runtime they load from run/mods.
def nestedModsDir = layout.buildDirectory.dir('nested-mods')
def extractNestedMods = tasks.register('extractNestedMods', Sync) {
    description = 'Extracts the nested Aeronautics and Ponder jars that Skyseam compiles against.'
    from {
        configurations.runMods.filter { it.name.startsWith('create-') }.collect { zipTree(it) }
    }
    include 'META-INF/jarjar/dev.eriksonn.aeronautics.aeronautics-*.jar', 'META-INF/jarjar/ponder-*.jar'
    eachFile { path = name }
    includeEmptyDirs = false
    into nestedModsDir
}
dependencies {
    compileOnly files(nestedModsDir.map { it.asFileTree.matching { include '*.jar' } }).builtBy(extractNestedMods)
}

def syncRunMods = tasks.register('syncRunMods', Sync) {
    description = 'Copies the runtime mods (Create, Aeronautics, Sable, Fealty) into run/mods.'
    from configurations.runMods
    into file('run/mods')
}
def syncCaptureMods = tasks.register('syncCaptureMods', Sync) {
    description = 'Copies the runtime mods into run/capture/mods for the screenshot client (runCaptureClient).'
    from configurations.runMods
    into file('run/capture/mods')
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
            // gradlew runServer -PbootCheck: stop on its own once the server has started (dev/DevBootCheck).
            systemProperty 'skyseam.dev.stopAfterBoot', project.hasProperty('bootCheck').toString()
        }
        gameTestServer {
            type = 'gameTestServer'
        }
        // gradlew runCaptureClient -Pscene=tools/capture/<scene>.json: a throwaway client in run/capture that plays a
        // scene and saves screenshots to run/capture/screenshots (client/dev/DevSceneCapture). Development only.
        captureClient {
            client()
            gameDirectory = file('run/capture')
            systemProperty 'skyseam.dev.capture', project.findProperty('scene') ? file(project.findProperty('scene')).absolutePath : ''
            programArguments.addAll '--width', '1280', '--height', '720'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            // -PgametestNamespaces=sable runs another mod's GameTests (used by the Step 0 physics check).
            systemProperty 'neoforge.enabledGameTestNamespaces',
                    (project.findProperty('gametestNamespaces') ?: project.mod_id).toString()
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range  : minecraft_version_range,
            neo_version_range        : neo_version_range,
            loader_version_range     : loader_version_range,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_license              : mod_license,
            mod_version              : mod_version,
            mod_authors              : mod_authors,
            mod_description          : mod_description,
            create_version_range     : create_version_range,
            simulated_version_range  : simulated_version_range,
            aeronautics_version_range: aeronautics_version_range,
            sable_version_range      : sable_version_range,
            geckolib_version_range   : geckolib_version_range,
            fealty_version_range     : fealty_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.matching { it.name.startsWith('run') && it.name != 'runMods' }.configureEach {
    dependsOn syncRunMods
}
tasks.matching { it.name == 'runCaptureClient' }.configureEach {
    dependsOn syncCaptureMods
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

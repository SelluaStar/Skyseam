org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

## Environment (pinned in Step 0, see docs/ENVIRONMENT.md)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Sable, Simulated and Aeronautics all require NeoForge 21.1.228 or newer.
neo_version=21.1.256
neo_version_range=[21.1.228,)
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Mod
mod_id=skyseam
mod_name=Skyseam
mod_license=All Rights Reserved
mod_version=0.0.1
mod_group_id=com.selluastar.skyseam
mod_authors=SelluaStar
mod_description=Fly an airship through a crack in the sky into the Halcyon, a small pocket world of floating islands, mirror seas and living light, and earn the way back out.

## Dependency ranges written into neoforge.mods.toml (all required, spec decision 4 and section 19)
create_version_range=[6.0.10,)
simulated_version_range=[1.3.2,)
aeronautics_version_range=[1.3.2,)
sable_version_range=[2.0.6,3.0.0)
geckolib_version_range=[4.9.3,)
fealty_version_range=[0.1.0,)

## Dependencies (pinned in Step 0; every external id is confirmed against these jars)
# GeckoLib 4.x line for 1.21.1 (Cloudsmith maven)
geckolib_version=4.9.3
# Sable physics (maven.ryanhcode.dev). Embeds Veil 4.3.2, sable_rapier and sable-companion.
sable_version=2.0.6
# Sable Companion, the small API library nested in Sable (SableCompanion, SubLevelAccess, BoundingBox3i).
sable_companion_version=1.6.0
# Create (Modrinth release). Sable's POM names the matching createmod build: 6.0.10-280.
create_version=6.0.10+mc1.21.1
# Create Aeronautics bundled jar (Modrinth only): Simulated, Aeronautics and Offroad 1.3.2.
aeronautics_version=1.3.2+mc1.21.1
# Fealty, the author's local build (libs/). Mod version 0.1.0, public API 1.3.0.
fealty_version=0.1.0
fealty_api_version=1.3.0
# FTB Teams (maven.ftb.dev), compile-only, for optional Aperture teammates. Not a dependency of the mod.
ftb_teams_version=2101.1.11

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Show dependency versions
        continue-on-error: true
        run: |
          probe() { echo "== $1"; curl -fsSL "$2" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | grep -E "$3" | tail -n 8 || true; }
          probe neoforge https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml '^21\.1\.'
          probe parchment https://maven.parchmentmc.org/org/parchmentmc/data/parchment-1.21.1/maven-metadata.xml '.'
          probe ftb-quests https://maven.ftb.dev/releases/dev/ftb/mods/ftb-quests-neoforge/maven-metadata.xml '^2101'
          probe ftb-library https://maven.ftb.dev/releases/dev/ftb/mods/ftb-library-neoforge/maven-metadata.xml '^2101'
          probe ftb-teams https://maven.ftb.dev/releases/dev/ftb/mods/ftb-teams-neoforge/maven-metadata.xml '^2101'
          probe architectury https://maven.architectury.dev/dev/architectury/architectury-neoforge/maven-metadata.xml '^13\.'
          probe kubejs https://maven.latvian.dev/releases/dev/latvian/mods/kubejs-neoforge/maven-metadata.xml '^2101'
          probe rhino https://maven.latvian.dev/releases/dev/latvian/mods/rhino/maven-metadata.xml '^2101'
          probe jade https://api.modrinth.com/maven/maven/modrinth/jade/maven-metadata.xml '1\.21\.1|neoforge'
          probe jei https://api.modrinth.com/maven/maven/modrinth/jei/maven-metadata.xml '^19\.'

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Game tests
        run: ./gradlew runGameTestServer --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fealty-jars
          path: build/libs/*.jar
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gametest-logs
          path: |
            run/logs/
            runs/gameTestServer/logs/
          if-no-files-found: ignore

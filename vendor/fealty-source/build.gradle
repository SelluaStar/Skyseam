plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Optional integrations live in their own folders and are only compiled when enabled,
// so the mod still builds if one of the third-party mavens is unavailable.
def compatModules = ['jade', 'jei', 'ftbquests', 'kubejs'].findAll {
    project.findProperty("compat_${it}")?.toString()?.toBoolean()
}

sourceSets {
    // The public API. Other mods compile against this jar only.
    // Sources live in the default folder for a source set named api: src/api/java.
    api {}
    main {
        compatModules.each {
            java.srcDir "src/compat/${it}/java"
            resources.srcDir "src/compat/${it}/resources"
        }
        resources.srcDir 'src/generated/resources'
    }
}

repositories {
    mavenLocal()
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'FTB'
        url = 'https://maven.ftb.dev/releases'
        content { includeGroup 'dev.ftb.mods' }
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev'
        content { includeGroup 'dev.architectury' }
    }
    maven {
        name = 'Latvian'
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.latvian.apps'
        }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.api)
        }
    }
}

// The API source set needs Minecraft and NeoForge on its classpath too.
neoForge.addModdingDependenciesTo(sourceSets.api)

dependencies {
    implementation sourceSets.api.output

    if (compatModules.contains('jade')) {
        compileOnly "maven.modrinth:jade:${jade_version}"
    }
    if (compatModules.contains('jei')) {
        compileOnly "maven.modrinth:jei:${jei_version}"
    }
    if (compatModules.contains('ftbquests')) {
        compileOnly "dev.ftb.mods:ftb-quests-neoforge:${ftb_quests_version}"
        compileOnly "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
        compileOnly "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"
        compileOnly "dev.architectury:architectury-neoforge:${architectury_version}"
    }
    if (compatModules.contains('kubejs')) {
        compileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
        compileOnly "dev.latvian.mods:rhino:${rhino_version}"
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            api_version            : api_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// The main jar carries the API classes so the mod is a single drop-in file.
tasks.named('jar', Jar) {
    from sourceSets.api.output
}

// A separate, versioned API jar for other mods to compile against.
def apiJar = tasks.register('apiJar', Jar) {
    archiveClassifier = 'api'
    archiveVersion = "${mod_version}+api.${api_version}"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.api.output
    from sourceSets.api.allJava
}
tasks.named('assemble') { dependsOn apiJar }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    // Report every compile error in one pass instead of stopping at 100.
    options.compilerArgs.addAll(['-Xmaxerrs', '10000'])
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = "${mod_id}-api"
            version = api_version
            artifact apiJar
        }
    }
    repositories {
        maven { url = file('repo').toURI() }
    }
}
